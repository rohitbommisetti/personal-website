<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/icon-32.png?v=4" />
    <link rel="icon" type="image/png" sizes="192x192" href="%PUBLIC_URL%/icon-192.png?v=4" />
    <link rel="icon" type="image/x-icon" sizes="48x48" href="%PUBLIC_URL%/favicon.ico?v=4" />
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/apple-touch-icon.png?v=4" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#faf8f0" />
    <script>
      (function () {
        var saved = null;
        try { saved = localStorage.getItem('theme'); } catch (e) {}
        var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').content = dark ? '#1c1d1b' : '#faf8f0';
      })();
    </script>
    <meta
      name="description"
      content="Renovus Capital"
    />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Rohit Bommisetti" />
    <meta property="og:title" content="Rohit Bommisetti" />
    <meta property="og:description" content="Renovus Capital" />
    <meta property="og:url" content="https://bommisetti.org/" />
    <meta property="og:image" content="https://bommisetti.org/og-image.jpg?v=1" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="1200" />
    <meta property="og:image:alt" content="Rohit Bommisetti as a kid" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Rohit Bommisetti" />
    <meta name="twitter:description" content="Renovus Capital" />
    <meta name="twitter:image" content="https://bommisetti.org/og-image.jpg?v=1" />
    <title>Rohit Bommisetti</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

</html>
